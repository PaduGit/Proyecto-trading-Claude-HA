name: Inventario HA
version: "0.1.0"
slug: inventario_ha
description: Exporta áreas, dispositivos, entidades y automatizaciones como markdown para copiar o descargar
arch:
  - aarch64
  - amd64
init: false
# Acceso a la API de Core con el token del Supervisor (respaldo del token propio)
homeassistant_api: true
# Solo lectura de /info y /host/info para la versión y el host
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:clipboard-list-outline
panel_title: Inventario
panel_admin: true
options:
  ha_token: ""
  ha_url: "http://192.168.1.10:8123"
  dominios_excluidos: "update,event,tts,conversation,todo,zone,sun"
  zona_horaria: America/Argentina/Buenos_Aires
schema:
  ha_token: password?
  ha_url: str?
  dominios_excluidos: str?
  zona_horaria: str?
