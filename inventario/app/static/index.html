<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario HA</title>
<style>
:root{
  --fondo:#f6f7f9; --panel:#ffffff; --texto:#1c1f24; --tenue:#5f6672;
  --borde:#d9dde3; --acento:#0b6bcb; --acento-texto:#ffffff; --error:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root{
    --fondo:#111418; --panel:#1b1f24; --texto:#e6e8eb; --tenue:#9aa3ae;
    --borde:#2e343c; --acento:#4b9cf0; --acento-texto:#0b1220; --error:#f2b8b5;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:12px}
.filtros{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px}
.filtros label{display:flex;align-items:center;gap:6px;cursor:pointer}
.botones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--borde);
  background:var(--panel);color:var(--texto);cursor:pointer;min-width:96px}
button.principal{background:var(--acento);border-color:var(--acento);color:var(--acento-texto);font-weight:600}
button:disabled{opacity:.5;cursor:default}
#inv-estado{color:var(--tenue);font-size:13px;margin:0 0 10px;min-height:1.2em}
#inv-estado.error{color:var(--error)}
pre{margin:0;max-height:60vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
  font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:10px}
footer{color:var(--tenue);font-size:12px;margin-top:10px;text-align:right}
</style>
</head>
<body>
<main>
  <h1>Inventario de Home Assistant</h1>
  <div class="panel">
    <div class="filtros">
      <label><input type="checkbox" id="inv-config" checked> Configuración</label>
      <label><input type="checkbox" id="inv-deshab" checked> Deshabilitadas y ocultas</label>
      <label><input type="checkbox" id="inv-diag"> Diagnóstico</label>
    </div>
    <div class="botones">
      <button class="principal" id="inv-copiar" disabled>Copiar</button>
      <button id="inv-bajar" disabled>Descargar</button>
      <button id="inv-generar">Releer</button>
    </div>
    <p id="inv-estado"></p>
    <pre id="inv-texto"></pre>
  </div>
  <footer id="inv-version"></footer>
</main>
<script>
const $ = s => document.querySelector(s);
const base = "";            // rutas relativas: quedan bajo el prefijo de Ingress
let texto = "";

function estado(msg, esError){
  const p = $("#inv-estado");
  p.textContent = msg;
  p.classList.toggle("error", !!esError);
}

async function generar(forzar){
  estado("Leyendo Home Assistant…");
  $("#inv-copiar").disabled = $("#inv-bajar").disabled = true;
  const q = new URLSearchParams({
    diag: $("#inv-diag").checked ? "1" : "0",
    config: $("#inv-config").checked ? "1" : "0",
    deshab: $("#inv-deshab").checked ? "1" : "0",
    forzar: forzar ? "1" : "0"
  });
  try{
    const r = await fetch(base + "api/inventario?" + q.toString());
    let j = {};
    try{ j = await r.json(); }catch(e){}
    if(!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
    texto = j.markdown || "";
    $("#inv-texto").textContent = texto;
    estado(j.resumen || "");
    $("#inv-copiar").disabled = $("#inv-bajar").disabled = !texto;
  }catch(e){
    texto = "";
    $("#inv-texto").textContent = "";
    estado("Error: " + e.message, true);
  }
}

/* De Ratios: el portapapeles moderno pide contexto seguro y por Ingress sin
   HTTPS no lo hay, así que se cae al textarea oculto con execCommand.
   Se copia el texto ya cargado, sin await previo, para no perder el toque. */
async function copiarTexto(txt, btn){
  const previo = btn.textContent;
  let ok = false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(txt);
      ok = true;
    }
  }catch(e){}
  if(!ok){
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    ta.setSelectionRange(0, txt.length);
    try{ ok = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }
  btn.textContent = ok ? "Copiado" : "No se pudo";
  setTimeout(() => { btn.textContent = previo; }, 1500);
}

$("#inv-copiar").addEventListener("click", e => {
  if(texto) copiarTexto(texto, e.currentTarget);
});

$("#inv-bajar").addEventListener("click", () => {
  if(!texto) return;
  /* El iframe de Ingress no deja navegar, pero sí descargar un blob. */
  const url = URL.createObjectURL(new Blob([texto], {type: "text/markdown;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = "inventario-ha-" + new Date().toISOString().slice(0, 10) + ".md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

$("#inv-generar").addEventListener("click", () => generar(true));
["#inv-diag", "#inv-config", "#inv-deshab"].forEach(s =>
  $(s).addEventListener("change", () => generar(false)));

$("#inv-version").textContent = "v" + (document.body.dataset.version || "?");
generar(false);
</script>
</body>
</html>
