  # Canje 2005 — ajustables por CER con cupón
  #
  # El CUAP capitalizó intereses hasta diciembre de 2013. Como esa
  # etapa terminó, se modela desde el capital ya capitalizado: por eso
  # las cuotas son del 5% de un nominal mayor al original.
  # ---------------------------------------------------------------

