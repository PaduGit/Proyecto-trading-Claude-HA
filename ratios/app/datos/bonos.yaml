      del 4 de septiembre de 2020 (Resolución 381/2020, ISIN ARARGE3209X6). La
      base CER quedaba corrida casi dos años y la TIR daba -37%. El cronograma
      de amortización en diez cuotas iguales desde el 9 de mayo de 2024 sí
      estaba bien.
