  X30S6:
    nombre: Letra Tesoro Nacional ajustable CER 30/09/2026
    ley: argentina
    moneda: ARS
    ajuste: cer
    tipo: cer
    emision: 2026-03-16
    vencimiento: 2026-09-30
    base: 30/360
    cer_base: 0
    corregido: >-
      La fecha estimada de 2025-09-30 daba una TIR de 203%. La letra se anunció
      como nueva en la licitación del jueves 12 de marzo de 2026, así que la
      emisión es la liquidación a T+2 de esa licitación.
    verificar: >-
      La fecha exacta sale de la resolución conjunta de marzo de 2026; acá se
      asumió T+2 sobre la licitación del 12/03/2026. Si difiere en unos días la
      TIR se mueve poco, pero conviene confirmarla.
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 6
      primer_pago: 2026-09-30
      tramos:
        - {desde: 2025-09-30, tasa: 0.0}

