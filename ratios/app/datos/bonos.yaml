  # ---------------------------------------------------------------
  # Ajustables por CER
  #
  # El capital se ajusta por el CER de 10 días hábiles antes de cada
  # fecha. La TIR que se calcula es REAL: el flujo se expresa en
  # unidades CER, así que el resultado es la tasa por encima de la
  # inflación. Eso es la X de "CER + X%".
  #
  # cer_base es el coeficiente a la fecha de emisión. Hasta que se
  # conecte la API del BCRA, se carga a mano acá y el valor de hoy
  # en la opción cer_actual de la configuración.
