# Cronogramas de bonos soberanos.
#
# Fuente: "Estructura financiera de Títulos Públicos", Oficina Nacional de
# Crédito Público, Ministerio de Economía — archivo al 31/05/2026.
#
# Las especies D (dólar MEP) y C (cable) comparten el flujo con su par en
# pesos: cambia dónde liquidan, no lo que paga el bono.

bonos:

  # ---------------------------------------------------------------
  # Canje 2020 — ley argentina
  # ---------------------------------------------------------------

  AL29:
    nombre: Bono Rep. Argentina USD 1% 2029
    ley: argentina
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2029-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2025-01-09
      frecuencia_meses: 6
      cuotas_iguales: 10
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 1.00}

  AL30:
    nombre: Bono Rep. Argentina USD Step Up 2030
    ley: argentina
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2030-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2024-07-09
      frecuencia_meses: 6
      cuotas: [4.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 0.50}
        - {desde: 2023-07-09, tasa: 0.75}
        - {desde: 2027-07-09, tasa: 1.75}

  AL35:
    nombre: Bono Rep. Argentina USD Step Up 2035
    ley: argentina
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2035-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2031-01-09
      frecuencia_meses: 6
      cuotas_iguales: 10
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 1.125}
        - {desde: 2022-07-09, tasa: 1.50}
        - {desde: 2023-07-09, tasa: 3.625}
        - {desde: 2024-07-09, tasa: 4.125}
        - {desde: 2027-07-09, tasa: 4.75}
        - {desde: 2028-07-09, tasa: 5.00}

  AE38:
    nombre: Bono Rep. Argentina USD Step Up 2038
    ley: argentina
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2038-01-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2027-07-09
      frecuencia_meses: 6
      cuotas_iguales: 22
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 2.00}
        - {desde: 2022-07-09, tasa: 3.875}
        - {desde: 2023-07-09, tasa: 4.25}
        - {desde: 2024-07-09, tasa: 5.00}

  AL41:
    nombre: Bono Rep. Argentina USD Step Up 2041
    ley: argentina
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2041-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2028-01-09
      frecuencia_meses: 6
      cuotas_iguales: 28
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 2.50}
        - {desde: 2022-07-09, tasa: 3.50}
        - {desde: 2029-07-09, tasa: 4.875}

  # ---------------------------------------------------------------
  # Canje 2020 — ley Nueva York
  # ---------------------------------------------------------------

  GD29:
    nombre: Bono Global Rep. Argentina USD 1% 2029
    ley: nueva_york
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2029-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2025-01-09
      frecuencia_meses: 6
      cuotas_iguales: 10
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 1.00}

  GD30:
    nombre: Bono Global Rep. Argentina USD Step Up 2030
    ley: nueva_york
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2030-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2024-07-09
      frecuencia_meses: 6
      cuotas: [4.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 0.50}
        - {desde: 2023-07-09, tasa: 0.75}
        - {desde: 2027-07-09, tasa: 1.75}

  GD35:
    nombre: Bono Global Rep. Argentina USD Step Up 2035
    ley: nueva_york
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2035-07-09
    base: 30/360
    verificar: >-
      El archivo del Ministerio describe la amortización del 2030 (13 cuotas
      de 4%+8%), que parece un error de copiado: el AL35, su par por ley
      argentina, dice 10 cuotas iguales desde enero de 2031. Se usa esa.
      También hay un salto en los tramos de tasa entre 2028 y 2029.
    amortizacion:
      tipo: cuotas
      fechas_desde: 2031-01-09
      frecuencia_meses: 6
      cuotas_iguales: 10
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 1.125}
        - {desde: 2022-07-09, tasa: 1.50}
        - {desde: 2023-07-09, tasa: 3.625}
        - {desde: 2024-07-09, tasa: 4.125}
        - {desde: 2027-07-09, tasa: 4.75}
        - {desde: 2029-07-09, tasa: 5.00}

  GD38:
    nombre: Bono Global Rep. Argentina USD Step Up 2038
    ley: nueva_york
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2038-01-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2027-07-09
      frecuencia_meses: 6
      cuotas_iguales: 22
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 2.00}
        - {desde: 2022-07-09, tasa: 3.875}
        - {desde: 2023-07-09, tasa: 4.25}
        - {desde: 2024-07-09, tasa: 5.00}

  GD41:
    nombre: Bono Global Rep. Argentina USD Step Up 2041
    ley: nueva_york
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2041-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2028-01-09
      frecuencia_meses: 6
      cuotas_iguales: 28
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 2.50}
        - {desde: 2022-07-09, tasa: 3.50}
        - {desde: 2029-07-09, tasa: 4.875}

  GD46:
    nombre: Bono Global Rep. Argentina USD Step Up 2046
    ley: nueva_york
    moneda: USD
    emision: 2020-09-04
    vencimiento: 2046-07-09
    base: 30/360
    amortizacion:
      tipo: cuotas
      fechas_desde: 2025-01-09
      frecuencia_meses: 6
      cuotas_iguales: 44
    interes:
      frecuencia_meses: 6
      primer_pago: 2021-07-09
      tramos:
        - {desde: 2020-09-04, tasa: 0.125}
        - {desde: 2021-07-09, tasa: 1.125}
        - {desde: 2022-07-09, tasa: 1.50}
        - {desde: 2023-07-09, tasa: 3.625}
        - {desde: 2024-07-09, tasa: 4.125}
        - {desde: 2027-07-09, tasa: 4.375}
        - {desde: 2028-07-09, tasa: 5.00}

  # ---------------------------------------------------------------
  # Bonares del Tesoro 2026 — bullet, cupón mensual
  # ---------------------------------------------------------------

  AO27:
    nombre: Bonar Tesoro Nacional 6% USD 29/10/2027
    ley: argentina
    moneda: USD
    emision: 2026-02-27
    vencimiento: 2027-10-29
    base: actual/360
    resolucion: Res. Conj. 11/2026
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 1
      dia_pago: ultimo_habil
      tramos:
        - {desde: 2026-02-27, tasa: 6.00}

  AO28:
    nombre: Bonar Tesoro Nacional 6% USD 31/10/2028
    ley: argentina
    moneda: USD
    emision: 2026-03-31
    vencimiento: 2028-10-31
    base: actual/360
    resolucion: Res. Conj. 16/2026
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 1
      dia_pago: ultimo_habil
      tramos:
        - {desde: 2026-03-31, tasa: 6.00}

  AO29:
    nombre: Bono Tesoro Nacional 6% USD 31/10/2029
    ley: argentina
    moneda: USD
    emision: 2026-06-30
    vencimiento: 2029-10-31
    base: actual/360
    verificar: >-
      No figura en el archivo del Ministerio al 31/05/2026 porque es
      posterior al corte. La estructura se dedujo del patrón de AO27 y AO28
      y de la descripción que devuelve IOL. La fecha de emisión es estimada:
      no afecta la TIR ni la duration, pero conviene confirmarla.
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 1
      dia_pago: ultimo_habil
      tramos:
        - {desde: 2026-06-30, tasa: 6.00}

  # ---------------------------------------------------------------
  # Ajustables por CER
  #
  # El capital se ajusta por el CER de 10 días hábiles antes de cada
  # fecha. La TIR que se calcula es REAL: el flujo se expresa en
  # unidades CER, así que el resultado es la tasa por encima de la
  # inflación. Eso es la X de "CER + X%".
  #
  # cer_base es el coeficiente a la fecha de emisión. Hasta que se
  # conecte la API del BCRA, se carga a mano acá y el valor de hoy
  # en la opción cer_actual de la configuración.
  # ---------------------------------------------------------------

  TZXA7:
    nombre: Boncer 0% 30/04/2027
    ley: argentina
    moneda: ARS
    ajuste: cer
    emision: 2025-11-28
    vencimiento: 2027-04-30
    base: 30/360
    resolucion: Res.Conj. Nº 60-E/2024
    cer_base: 0
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 6
      primer_pago: 2027-04-30
      tramos:
        - {desde: 2025-11-28, tasa: 0.0}

  TZXS8:
    nombre: Boncer 0% 29/09/2028
    ley: argentina
    moneda: ARS
    ajuste: cer
    emision: 2026-03-31
    vencimiento: 2028-09-29
    base: 30/360
    resolucion: Res.Conj. Nº 16-E/2026
    cer_base: 0
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 6
      primer_pago: 2028-09-29
      tramos:
        - {desde: 2026-03-31, tasa: 0.0}

  TZXM9:
    nombre: Boncer 0% 28/03/2029
    ley: argentina
    moneda: ARS
    ajuste: cer
    emision: 2026-04-01
    vencimiento: 2029-03-28
    base: 30/360
    resolucion: Res.Conj. Nº 16-E/2026
    cer_base: 0
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 6
      primer_pago: 2029-03-28
      tramos:
        - {desde: 2026-04-01, tasa: 0.0}

  TX31:
    nombre: Boncer 2,50% 30/11/2031
    ley: argentina
    moneda: ARS
    ajuste: cer
    emision: 2022-05-31
    vencimiento: 2031-11-30
    base: 30/360
    resolucion: RESFC-2022-40-APN-SH#MEC
    cer_base: 0
    corregido: >-
      El archivo del Ministerio dice "integra al vencimiento", pero el flujo
      real muestra 10 cuotas iguales de amortización desde mayo de 2027, con
      la renta decreciendo de 21,70 a 2,17 sobre residual. Con bullet la
      renta sería constante. Se usa el cronograma real.
    amortizacion:
      tipo: cuotas
      fechas_desde: 2027-05-31
      frecuencia_meses: 6
      cuotas_iguales: 10
    interes:
      frecuencia_meses: 6
      primer_pago: 2022-11-30
      tramos:
        - {desde: 2022-05-31, tasa: 2.50}

  TZXD8:
    nombre: Boncer 0% 15/12/2028
    ley: argentina
    moneda: ARS
    ajuste: cer
    emision: 2026-06-30
    vencimiento: 2028-12-15
    base: 30/360
    resolucion: Licitación del 24/06/2026, liquidación 30/06/2026
    cer_base: 0
    amortizacion: {tipo: bullet}
    interes:
      frecuencia_meses: 6
      primer_pago: 2028-12-15
      tramos:
        - {desde: 2026-06-30, tasa: 0.0}

