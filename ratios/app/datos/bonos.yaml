  DICP:
    nombre: Discount en pesos CER 5,83% 2033
    ley: argentina
    moneda: ARS
    ajuste: cer
    tipo: cer
    emision: 2003-12-31
    vencimiento: 2033-12-31
    base: 30/360
    cer_base: 0
    nominal_base: 127.09
    derivacion: >-
      El nominal de partida no es 100 porque el bono capitalizo parte de los
      intereses hasta el 31/12/2013, en dos tramos step-up: entre 2003 y 2008
      pago 2,79% en efectivo y capitalizo 3,04% anual (1,52% semestral), y
      entre 2008 y 2013 pago 4,06% y capitalizo 1,77% (0,885% semestral).
      Encadenando (1,0152)^10 x (1,00885)^10 se llega a 1,2699, o sea 127,0
      por cada 100 nominales originales. El valor cargado, 127,09, difiere en
      0,08% por convencion de dias y es el que usan las planillas de mercado.
      Contrastado ademas contra la curva CER: con 127,09 el bono rinde 9,4%
      con duration modificada 3,0, coherente con TX31 (9,5% a 2,5) y CUAP
      (9,2% a 9,2). Con 120,4 rendiria 7,6% y con 140,3 rendiria 12,8%, dos
      desarbitrajes que no se sostienen en un bono liquido.
