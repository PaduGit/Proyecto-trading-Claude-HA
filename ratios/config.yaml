name: Ratios IOL
version: "0.19.1"
slug: ratios_iol
description: Monitor de ratios entre especies, arbitraje de plazos y screener
url: https://github.com/PaduGit/Proyecto-trading-Claude-HA
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
map:
  - addon_config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:swap-horizontal
panel_title: Ratios
options:
  iol_user: ""
  iol_pass: ""
  canal_alertas: ambos
  ha_notify_service: notify.mobile_app_motorola_razr_60_ultra
  panel_path: /5ed1f7ab_ratios_iol
  addon_slug: 5ed1f7ab_ratios_iol
  mep_par_pesos: AL30
  mep_par_usd: AL30D
  ha_token: ""
  ha_url: ""
  telegram_token: ""
  telegram_chat_id: ""
  publicar_sensores: true
  poll_seconds: 600
  min_segundos_manual: 20
  market_open: "10:30"
  market_close: "17:15"
  timezone: America/Argentina/Buenos_Aires
  histeresis_pct: 0.5
  rulo_umbral_pct: 0.6
  curva_umbral_z: 2.5
  cer_actual: 0
  tasa_caucion_anual: 0
  opc_subyacentes: GGAL
  opc_panel: De Acciones
  opc_dias_min: 15
  opc_dias_max: 80
  opc_saltos: 3
  opc_limite_base_pct: 5
  opc_riesgo_tabla_pct: 45
  opc_riesgo_alarma_pct: 33
  opc_bear_instrumento: ambos
  opc_lotes_min: 2
  opc_ciclos_persistencia: 1
  paneles:
    - instrumento: Bonos
      panel: Soberanos en dólares
      pais: argentina
    - instrumento: Acciones
      panel: Merval
      pais: argentina
  derechos_mercado_pct: 0
  iva_pct: 21
  comisiones:
    - instrumento: acciones
      pct: 0.15
    - instrumento: bonos
      pct: 0.15
    - instrumento: opciones
      pct: 0.5
    - instrumento: cauciones
      pct: 0.05
  arbitraje_tickers: []
  pares:
    - alias: ALUA/TXAR
      num: ALUA
      den: TXAR
      mercado: bCBA
      plazo: t1
      resistencia: 1.54
      soporte: 1.36
      alertas: true
    - alias: LOMA/HARG
      num: LOMA
      den: HARG
      mercado: bCBA
      plazo: t1
      resistencia: 2.2
      soporte: 1.7
      alertas: true
    - alias: GD30/AL30
      num: GD30
      den: AL30
      mercado: bCBA
      plazo: t1
      resistencia: 1.03
      soporte: 1.0
      alertas: true
    - alias: AO28/AO29
      num: AO28
      den: AO29
      mercado: bCBA
      plazo: t1
      resistencia: 0
      soporte: 0
      alertas: false
    - alias: AL30/AL30D (MEP)
      num: AL30
      den: AL30D
      mercado: bCBA
      plazo: t1
      resistencia: 0
      soporte: 0
      alertas: false
schema:
  iol_user: str
  iol_pass: password
  canal_alertas: list(ha|telegram|ambos)
  ha_notify_service: str?
  panel_path: str?
  addon_slug: str?
  mep_par_pesos: str?
  mep_par_usd: str?
  ha_token: password?
  ha_url: str?
  telegram_token: password?
  telegram_chat_id: str?
  publicar_sensores: bool
  poll_seconds: int(30,3600)
  min_segundos_manual: int(0,300)
  market_open: str
  market_close: str
  timezone: str
  histeresis_pct: float(0,10)
  rulo_umbral_pct: float(0,20)
  curva_umbral_z: float(0,10)
  cer_actual: float(0,100000)
  tasa_caucion_anual: float(0,500)
  opc_subyacentes: str?
  opc_panel: str?
  opc_dias_min: int(0,400)
  opc_dias_max: int(0,400)
  opc_saltos: int(1,10)
  opc_limite_base_pct: float(0,50)
  opc_riesgo_tabla_pct: float(0,100)
  opc_riesgo_alarma_pct: float(0,100)
  opc_bear_instrumento: list(puts|calls|ambos)
  opc_lotes_min: int(0,10000)
  opc_ciclos_persistencia: int(1,20)
  paneles:
    - instrumento: str
      panel: str
      pais: str
  derechos_mercado_pct: float(0,10)
  iva_pct: float(0,50)
  comisiones:
    - instrumento: str
      pct: float(0,10)
  arbitraje_tickers:
    - ticker: str
      mercado: str?
      tipo: str?
  pares:
    - alias: str
      num: str
      den: str
      mercado: str
      plazo: str
      resistencia: float
      soporte: float
      factor: float?
      alertas: bool
