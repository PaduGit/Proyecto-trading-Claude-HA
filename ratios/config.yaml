name: Ratios IOL
version: "0.1.0"
slug: ratios_iol
description: Monitor de ratios entre especies con alertas por Telegram y screener web
url: https://github.com/TU_USUARIO/ha-ratios
arch:
  - aarch64
  - amd64
  - armv7
init: false
map:
  - addon_config:rw
ingress: true
ingress_port: 8099
panel_icon: mdi:swap-horizontal
panel_title: Ratios
options:
  iol_user: ""
  iol_pass: ""
  telegram_token: ""
  telegram_chat_id: ""
  poll_seconds: 180
  market_open: "11:00"
  market_close: "17:15"
  timezone: "America/Argentina/Buenos_Aires"
  alert_cooldown_minutes: 90
  confirm_readings: 2
  pares:
    - alias: "ALUA/TXAR"
      num: "ALUA"
      den: "TXAR"
      mercado: "bCBA"
      plazo: "t1"
      resistencia: 1.54
      soporte: 1.36
      alertas: true
    - alias: "LOMA/HARG"
      num: "LOMA"
      den: "HARG"
      mercado: "bCBA"
      plazo: "t1"
      resistencia: 2.2
      soporte: 1.7
      alertas: true
    - alias: "GD30/AL30"
      num: "GD30"
      den: "AL30"
      mercado: "bCBA"
      plazo: "t1"
      resistencia: 1.03
      soporte: 1.0
      alertas: true
    - alias: "AO28/AO29"
      num: "AO28"
      den: "AO29"
      mercado: "bCBA"
      plazo: "t1"
      resistencia: 0
      soporte: 0
      alertas: false
    - alias: "AL30/AL30D (MEP)"
      num: "AL30"
      den: "AL30D"
      mercado: "bCBA"
      plazo: "t1"
      resistencia: 0
      soporte: 0
      alertas: false
schema:
  iol_user: str
  iol_pass: password
  telegram_token: password
  telegram_chat_id: str
  poll_seconds: int(30,3600)
  market_open: str
  market_close: str
  timezone: str
  alert_cooldown_minutes: int(0,1440)
  confirm_readings: int(1,10)
  pares:
    - alias: str
      num: str
      den: str
      mercado: str
      plazo: str
      resistencia: float
      soporte: float
      alertas: bool
